services:
  demo:
    build: .
    init: true
    ports:
      - "127.0.0.1:${LOCAL_PORT:-8787}:8787"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/api/health').then(r => { if (!r.ok) process.exit(1); }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 3
